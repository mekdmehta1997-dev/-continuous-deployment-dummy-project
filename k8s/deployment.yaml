
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-loan-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dummy-loan-api
  template:
    metadata:
      labels:
        app: dummy-loan-api
    spec:
      containers:
        - name: api
          image: dummy-loan-api:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
