name: Dummy API CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Ruff
        run: ruff check .
      - name: Run tests
        run: python -m pytest -v

  publish:
    name: Build and publish Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dummy-loan-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dummy-loan-api:${{ github.sha }}

  deploy:
    name: Deploy to local Kubernetes
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Update Kubernetes deployment
        shell: pwsh
        run: |
          kubectl set image deployment/dummy-loan-api api=${{ secrets.DOCKERHUB_USERNAME }}/dummy-loan-api:${{ github.sha }}
          kubectl rollout status deployment/dummy-loan-api --timeout=180s
